<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming-påmelding</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, two numbered steps, nothing else */
:root{
  --bg:#f6f7f9; --fg:#15181e; --muted:#6b7280; --line:#e1e4ea; --surface:#ffffff;
  --font:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --fg:#eceef2; --muted:#959cab; --line:#262a33; --surface:#181b21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --fg:#eceef2; --muted:#959cab; --line:#262a33; --surface:#181b21; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:64px 40px}
main{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.logos{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:18px}
.logos img{height:auto;display:block}
.logos .tk{width:132px}
.logos .rb{width:84px}
.logos .x{color:var(--muted);font-size:18px}
h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
a{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;color:var(--fg);text-decoration:none;
  transition:border-color .15s ease}
a:hover{border-color:var(--fg)}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.n{flex:0 0 28px;height:28px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--muted)}
.t{min-width:0;display:flex;flex-direction:column;gap:2px}
.t strong{font-weight:600}
.t small{color:var(--muted);font-size:14px}
.go{margin-left:auto;color:var(--muted)}
@media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
